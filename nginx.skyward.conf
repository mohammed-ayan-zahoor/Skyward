server {
    listen 80;
    server_name skyward.yourdomain.com; # <-- Replace with your domain or subdomain

    # Increase max upload size for high-resolution canopy photos
    client_max_body_size 25M;

    # Serve uploaded canopy images directly from disk for optimal performance
    location /uploads/ {
        alias /var/www/skyward/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to Express backend (port 7001)
    location /api/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all website page requests to Next.js frontend (port 7005)
    location / {
        proxy_pass http://127.0.0.1:7005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
